name: Build Android APK — Delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://olivepizza-owner.onrender.com
          VITE_BACKEND_URL: https://olivepizza-owner.onrender.com
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: olive-pizza-08
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Build Tools
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make Gradlew executable
        run: chmod +x android/gradlew
        working-directory: ${{ github.workspace }}

      - name: Prepare debug keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "KEYSTORE_SOURCE=secret" >> $GITHUB_ENV
          else
            keytool -genkey -v -keystore android/app/release.keystore \
              -alias olivepizzadelivery -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass olivepizza123 -keypass olivepizza123 \
              -dname "CN=Olive Pizza Delivery, OU=Mobile, O=Olive Pizza, L=India, ST=India, C=IN"
            echo "KEYSTORE_SOURCE=auto-generated" >> $GITHUB_ENV
          fi

      - name: Configure signing in gradle.properties
        run: |
          cat >> android/gradle.properties << 'EOF'
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_KEY_ALIAS=olivepizzadelivery
          MYAPP_RELEASE_STORE_PASSWORD=olivepizza123
          MYAPP_RELEASE_KEY_PASSWORD=olivepizza123
          EOF

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Find and rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          mkdir -p release-artifacts
          cp "$APK_PATH" "release-artifacts/OlivePizza-Delivery-$(date +%Y%m%d)-release.apk"
          echo "APK_FILE=release-artifacts/OlivePizza-Delivery-$(date +%Y%m%d)-release.apk" >> $GITHUB_ENV
          echo "APK found at: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlivePizza-Delivery-APK
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 'Olive Pizza Delivery — Android Build'
          body: |
            🤖 **Olive Pizza Delivery Android Build**
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Keystore: ${{ env.KEYSTORE_SOURCE }}
            - Backend: https://olivepizza-owner.onrender.com
          files: release-artifacts/*.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
